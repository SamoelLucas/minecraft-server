# ─── Autenticação ────────────────────────────────────────────────────────────
online-mode=false
# ─────────────────────────────────────────────────────────────────────────────

# Rede
server-port=25565
server-ip=
max-players=20

# Mundo
level-name=world
level-seed=
gamemode=survival
difficulty=normal
pvp=true
spawn-protection=16
max-world-size=29999984

# Desempenho
view-distance=8
simulation-distance=6
max-tick-time=60000
network-compression-threshold=256
use-native-transport=true
entity-broadcast-range-percentage=100

# Comportamento
allow-nether=true
allow-flight=false
enable-command-block=false
spawn-monsters=true
spawn-animals=true
spawn-npcs=true
generate-structures=true
force-gamemode=false
hardcore=false

# RCON (desativado por padrão — ative para gerenciamento remoto)
enable-rcon=false
rcon.port=25575
rcon.password=

# Query (status do servidor)
enable-query=false
query.port=25565

# Outros
motd=\u00a7aServidor NeoForge 1.21.1
white-list=false
enforce-whitelist=false
prevent-proxy-connections=false
rate-limit=0
